name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Release signing uses repository secrets:
      #   ANDROID_KEYSTORE_BASE64    keystore file (.jks), base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD  storePassword
      #   ANDROID_KEY_PASSWORD       keyPassword
      #   ANDROID_KEY_ALIAS          keyAlias (optional, defaults to "jujur")
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret penandatanganan belum diatur:$missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-jujur}"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Verify signatures and collect APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$BT/apksigner" verify "$f"
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "dist/jujur-$VERSION-${{ github.run_number }}-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo "### APK Jujur $VERSION (build ${{ github.run_number }})"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "Sebagian besar ponsel Android modern memakai berkas **arm64-v8a**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: jujur-apk-${{ github.run_number }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
